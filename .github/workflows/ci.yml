name: CI

on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      # example/ needs the Flutter SDK, which this job doesn't install.
      - run: dart pub get --no-example
      - run: dart format --output=none --set-exit-if-changed lib bin hook test
      - run: dart analyze lib bin hook test
      # Same setup as publish.yml, so a broken publish shows up before tagging.
      - run: dart pub publish --dry-run

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        # The lowest supported SDK (pubspec.yaml) and the latest.
        sdk: [3.10.0, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get --no-example
      - run: dart test

  # Builds the example app in release mode, which is what ships, and checks
  # that it finds and runs the bundled rg.
  example:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            app: build/macos/Build/Products/Release/example.app/Contents/MacOS/example
          - os: ubuntu-latest
            app: build/linux/x64/release/bundle/example
          - os: ubuntu-24.04-arm
            app: build/linux/arm64/release/bundle/example
          - os: windows-latest
            app: build/windows/x64/runner/Release/example.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # Flutter publishes no prebuilt SDK for Linux arm64, so clone it there.
      - if: matrix.os != 'ubuntu-24.04-arm'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - run: flutter build ${{ runner.os == 'macOS' && 'macos' || runner.os == 'Linux' && 'linux' || 'windows' }} --release
      - name: Show where rg landed
        run: find build -name 'rg' -o -name 'rg.exe' | xargs ls -l
      - name: Run the app
        env:
          DART_RIPGREP_RESULT: result.txt
        run: |
          status=0
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a "${{ matrix.app }}" || status=$?
          else
            "${{ matrix.app }}" || status=$?
          fi
          cat "$DART_RIPGREP_RESULT" 2>/dev/null || true
          exit $status
